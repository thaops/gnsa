buildscript {
    repositories {
        google()
        jcenter()
    }
    // Note: AGP version is now managed in settings.gradle plugins block
    // This classpath is kept for backward compatibility but may not be used
    dependencies {
        // classpath 'com.android.tools.build:gradle:8.0.2'
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        flatDir {
            dirs 'libs'
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
